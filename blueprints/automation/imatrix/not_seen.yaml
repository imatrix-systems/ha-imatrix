blueprint:
  name: iMatrix device not seen
  description: >-
    Notify when an iMatrix device has not checked in for a number of hours.
    Uses the last_seen attribute of the device's Connectivity sensor.
  domain: automation
  source_url: https://github.com/imatrix-systems/ha-imatrix/blob/main/blueprints/automation/imatrix/not_seen.yaml
  input:
    connectivity:
      name: Connectivity sensor
      selector:
        entity:
          filter:
            - integration: imatrix
              domain: sensor
              device_class: enum
    hours:
      name: Hours without a check-in
      default: 12
      selector:
        number:
          min: 1
          max: 168
          unit_of_measurement: h
    notify_device:
      name: Phone to notify
      selector:
        device:
          filter:
            - integration: mobile_app
variables:
  connectivity: !input connectivity
  last_seen: "{{ state_attr(connectivity, 'last_seen') }}"
  hours: !input hours
mode: single
triggers:
  - trigger: time_pattern
    minutes: "/15"
conditions:
  - condition: template
    value_template: >-
      {{ last_seen not in [none, '', 'None']
         and (now() - as_datetime(last_seen)).total_seconds() > hours * 3600
         and (this.attributes.last_triggered is none
              or (now() - this.attributes.last_triggered).total_seconds() > hours * 3600) }}
actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: iMatrix device silent
    message: >-
      {{ state_attr(connectivity, 'friendly_name') }}: no check-in for more than {{ hours }} hours.
